<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 主背景渐变 - 温暖渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9A56;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A6F;stop-opacity:1" />
    </linearGradient>

    <!-- 气泡渐变 -->
    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF5F0;stop-opacity:1" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF6B6B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景正方形 -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bgGradient)"/>

  <!-- 左侧气泡 - 带说话尾巴的圆形 -->
  <g transform="translate(320, 512)">
    <!-- 气泡主体 - 圆形（与右侧相同大小） -->
    <circle cx="0" cy="0" r="220" fill="url(#bubbleGradient)" filter="url(#shadow)"/>
    <!-- 说话尾巴 - 朝左下 -->
    <path d="M -145 130 L -200 220 L -90 165 Z" fill="url(#bubbleGradient)"/>

    <!-- 左侧气泡内部 - 简洁眼睛（说话中） -->
    <!-- 左眼 -->
    <circle cx="-55" cy="-30" r="28" fill="#4A2511"/>
    <circle cx="-47" cy="-38" r="9" fill="white"/>
    <!-- 右眼 -->
    <circle cx="55" cy="-30" r="28" fill="#4A2511"/>
    <circle cx="63" cy="-38" r="9" fill="white"/>

    <!-- 说话嘴型 - O型 -->
    <ellipse cx="0" cy="55" rx="18" ry="22" fill="#4A2511"/>

    <!-- 小腮红 -->
    <ellipse cx="-85" cy="40" rx="18" ry="11" fill="#FFB6C1" opacity="0.6"/>
    <ellipse cx="85" cy="40" rx="18" ry="11" fill="#FFB6C1" opacity="0.6"/>
  </g>

  <!-- 右侧气泡 - 带说话尾巴的圆形（与左侧部分重叠） -->
  <g transform="translate(704, 512)">
    <!-- 气泡主体 - 圆形 -->
    <circle cx="0" cy="0" r="220" fill="url(#bubbleGradient)" filter="url(#shadow)"/>
    <!-- 说话尾巴 - 朝右下 -->
    <path d="M 145 130 L 200 220 L 90 165 Z" fill="url(#bubbleGradient)"/>

    <!-- 右侧气泡内部 - 简洁眼睛（倾听中） -->
    <!-- 左眼 -->
    <circle cx="-55" cy="-30" r="28" fill="#4A2511"/>
    <circle cx="-47" cy="-38" r="9" fill="white"/>
    <!-- 右眼 -->
    <circle cx="55" cy="-30" r="28" fill="#4A2511"/>
    <circle cx="63" cy="-38" r="9" fill="white"/>

    <!-- 微笑嘴型 -->
    <path d="M -40 55 Q 0 82, 40 55" stroke="#4A2511" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- 小腮红 -->
    <ellipse cx="-85" cy="40" rx="18" ry="11" fill="#FFB6C1" opacity="0.6"/>
    <ellipse cx="85" cy="40" rx="18" ry="11" fill="#FFB6C1" opacity="0.6"/>
  </g>
</svg>
